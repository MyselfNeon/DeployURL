<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gdrive Authorization</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://i.ibb.co/00CXb06/neon.jpg') center/cover no-repeat fixed;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; 
        }
        
        .card {
            background: rgba(15, 15, 20, 0.75); 
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(79, 172, 254, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin: 0 20px; 
            box-sizing: border-box;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 22px; 
            margin-top: 0;
            color: #0ff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            letter-spacing: 0.5px;
            white-space: nowrap; 
        }

        p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            color: #ccffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
            font-size: 14px; 
            margin-bottom: 25px;
            line-height: 1.5; 
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            color: #0ff; 
            border: 1px solid rgba(79, 172, 254, 0.4);
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            margin-bottom: 20px;
            box-sizing: border-box;
            word-break: break-all;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        textarea:focus {
            border-color: rgba(79, 172, 254, 0.8);
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.3), inset 0 0 5px rgba(79, 172, 254, 0.2);
        }

        .action-btn {
            display: block; 
            background-color: transparent;
            color: #0ff; 
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            border: 1px solid #39ff14;
            padding: 15px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px; 
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            white-space: nowrap; 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
            text-decoration: none; 
            margin-bottom: 15px; 
            text-align: center;
        }

        .action-btn:last-child {
            margin-bottom: 0;
        }

        .action-btn:hover {
            background-color: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .signature {
            position: fixed;
            bottom: 20px;
            right: 30px;
            font-family: 'Dancing Script', cursive;
            font-size: 38px;
            color: #ccffcc; 
            text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 20px #00cc00, 0 0 35px #009900;
            pointer-events: none; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Authorization code</h2>
        <p>Send this code directly to the bot, or copy it manually.</p>
        <textarea id="codeBox" readonly>Loading code...</textarea>
        
        <button id="copyBtn" class="action-btn" onclick="copyCode()">Copy to clipboard</button>
        <a id="tgBtn" class="action-btn" href="#">🚀 SEND TO TELEGRAM</a>
    </div>

    <div class="signature">MyselfNeon</div>

    <script>
        // 1. CHANGE THIS TO YOUR BOT'S USERNAME (Without the @)
        const BOT_USERNAME = "NeonGDriveBot";

        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        const codeBox = document.getElementById('codeBox');
        const tgBtn = document.getElementById('tgBtn');

        if (authCode) {
            const decodedCode = decodeURIComponent(authCode);
            codeBox.value = decodedCode; 
            tgBtn.href = `https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(decodedCode)}`;
        } else {
            // BEHAVES EXACTLY LIKE YOUR ORIGINAL CODE NOW!
            codeBox.value = "Error: No code found in the URL. Please try logging in via the bot again.";
            tgBtn.href = `https://t.me/${BOT_USERNAME}`; // Just opens the bot normally if clicked
        }

        function copyCode() {
            if (!authCode) return;
            
            codeBox.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            btn.innerText = "Copied! ✅";
            
            btn.style.backgroundColor = "rgba(57, 255, 20, 0.2)";
            btn.style.color = "#0ff";
            btn.style.borderColor = "#39ff14";
            btn.style.boxShadow = "0 0 12px rgba(57, 255, 20, 0.4)";
            
            setTimeout(() => {
                btn.innerText = "COPY TO CLIPBOARD";
                btn.style.backgroundColor = "transparent";
                btn.style.color = "#0ff";
                btn.style.borderColor = "#39ff14";
                btn.style.boxShadow = "0 0 8px rgba(57, 255, 20, 0.2)";
            }, 2000);
        }
    </script>

</body>
</html>
