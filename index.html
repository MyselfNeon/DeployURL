<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocoyo Style Meme Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* --- CONTROLS --- */
        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            background-color: #008CFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #006ebc; }

        /* --- THE STAGE --- */
        .stage {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: white; /* White background like the meme */
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- USER IMAGE (The Target) --- */
        .image-container {
            position: relative;
            z-index: 1; /* Behind the character */
        }

        .user-photo {
            width: 150px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0; /* Hidden until animation starts */
            transform: scale(0.5);
        }

        /* Animation: Zoom In and Fade In */
        .play-zoom {
            animation: zoomInEffect 3s forwards;
        }

        @keyframes zoomInEffect {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* --- THE CHARACTER (Pocoyo) --- */
        .character {
            position: absolute;
            bottom: 20px;
            right: -300px; /* Start hidden off-screen to the right */
            width: 250px;
            height: auto;
            z-index: 10; /* In front of the image */
        }

        /* Animation: Run In, Stop, and Bounce */
        .play-enter {
            animation: enterAndStop 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes enterAndStop {
            0% { right: -300px; }
            40% { right: 250px; } /* Run past a little (optional) or just arrive */
            60% { right: 180px; transform: scale(1); } /* Stop here */
            80% { right: 180px; transform: scale(1.1); } /* Little bounce/surprise */
            100% { right: 180px; transform: scale(1); }
        }

        /* --- HEARTS --- */
        .hearts-box {
            position: absolute;
            top: -50px;
            right: -40px;
            font-size: 50px;
            opacity: 0;
        }

        .play-hearts {
            animation: heartsPop 0.5s ease-out 2s forwards; /* Delays 2s */
        }

        @keyframes heartsPop {
            0% { transform: translateY(20px) scale(0); opacity: 0; }
            80% { transform: translateY(-10px) scale(1.2); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="imgUrl" placeholder="Paste Image Link (JPG/PNG)" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400">
        <button onclick="runAnimation()">▶ Play Meme</button>
    </div>

    <div class="stage">
        
        <div class="image-container">
            <img id="targetPhoto" class="user-photo" src="" alt="User Image">
            <div id="hearts" class="hearts-box">❤️❤️❤️</div>
        </div>

        <img id="character" class="character" 
             src="https://cdn-icons-png.flaticon.com/512/4600/4600366.png" 
             alt="Character">

    </div>

    <script>
        function runAnimation() {
            // 1. Get elements
            const photo = document.getElementById('targetPhoto');
            const char = document.getElementById('character');
            const hearts = document.getElementById('hearts');
            const input = document.getElementById('imgUrl');

            // 2. Set user image
            if (input.value) {
                photo.src = input.value;
            }

            // 3. RESET Animation (The Reflow Trick)
            photo.classList.remove('play-zoom');
            char.classList.remove('play-enter');
            hearts.classList.remove('play-hearts');

            void photo.offsetWidth; // Force browser to refresh

            // 4. START Animation
            photo.classList.add('play-zoom');
            char.classList.add('play-enter');
            hearts.classList.add('play-hearts');
        }

        // Run on load
        window.onload = runAnimation;
    </script>

</body>
</html>
