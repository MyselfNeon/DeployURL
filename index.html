<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gdrive Authorization</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <h2>Authorization Code</h2>
        <p>Click the button below to copy the code and open the bot.</p>
        <textarea id="codeBox" readonly>Loading code...</textarea>
        
        <button id="actionBtn" class="action-btn">COPY & REDIRECT TO BOT</button>
    </div>

    <div class="signature">MyselfNeon</div>

    <script>
        // --- BACKGROUND LOGIC ---
        // Add your direct image links here, separated by a space.
        // Make sure links end in .jpg, .png, etc., for proper rendering.
        const imageLinksString = "https://i.ibb.co/8L00MQyG/neon.jpg https://i.ibb.co/RKp34Hd/neon.jpg https://i.ibb.co/3mVkMYv2/neon.jpg https://i.ibb.co/00CXb06/neon.jpg";
        
        // Splits the string by spaces into an array
        const hardcodedImages = imageLinksString.trim().split(/\s+/);

        function setBackground(imageUrl) {
            document.body.style.background = `url('${imageUrl}') center/cover no-repeat fixed`;
        }

        function loadRandomBackground() {
            // Generate a random number between 0 and 1
            const rand = Math.random();
            
            if (rand < 0.25) {
                // 25% probability: Pick a random image from the hardcoded string
                const randomIndex = Math.floor(Math.random() * hardcodedImages.length);
                setBackground(hardcodedImages[randomIndex]);
            } else {
                // 75% probability: Fetch spicy (ero) images from waifu.im API
            fetch('https://api.waifu.im/images?IncludedTags=ero')
                    .then(response => response.json())
                    .then(data => {
                        // Using 'items' instead of 'images' based on the new API structure
                        if(data && data.items && data.items.length > 0) {
                            setBackground(data.items[0].url);
                        } else {
                            throw new Error("Invalid waifu.im response or empty items array"); 
                        }
                    })
                    .catch(error => {
                        console.error("Waifu.im failed. Falling back to hardcoded images.", error);
                        
                        // Fallback: Pick a random image from your hardcoded list if the API fails
                        const fallbackIndex = Math.floor(Math.random() * hardcodedImages.length);
                        setBackground(hardcodedImages[fallbackIndex]);
                    });
            }
        }

        // Initialize background on page load
        loadRandomBackground();


        // --- AUTHORIZATION LOGIC ---
        const BOT_USERNAME = "NeonGDriveBot";

        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        const codeBox = document.getElementById('codeBox');
        const actionBtn = document.getElementById('actionBtn');

        if (authCode) {
            const decodedCode = decodeURIComponent(authCode);
            codeBox.value = decodedCode; 
            
            actionBtn.addEventListener('click', function(e) {
                e.preventDefault(); 
                
                // Copy the code
                codeBox.select();
                document.execCommand('copy');
                
                // Update text and apply Blue success styling
                actionBtn.innerText = "COPIED! REDIRECTING... 🚀";
                actionBtn.style.backgroundColor = "rgba(0, 170, 255, 0.2)";
                actionBtn.style.boxShadow = "0 0 12px rgba(0, 170, 255, 0.4)";
                
                // Redirect to Telegram after 800ms
                setTimeout(() => {
                    window.location.href = `https://t.me/${BOT_USERNAME}`;
                }, 800);
            });

        } else {
            codeBox.value = "Error: No code found in the URL. Please try logging in via the bot again.";
            actionBtn.innerText = "RETURN TO BOT";
            
            actionBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = `https://t.me/${BOT_USERNAME}`;
            });
        }
    </script>

</body>
</html>
