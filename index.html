<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gdrive Authorization</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            margin-bottom: 20px;
            box-sizing: border-box;
            word-break: break-all;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Authorization code</h2>
        <p>Please copy this code, switch to your bot and paste it there.</p>
        <textarea id="codeBox" readonly>Loading code...</textarea>
        <button id="copyBtn" onclick="copyCode()">Copy to clipboard</button>
    </div>

    <script>
        // 1. Grab the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // 2. Look for the "code=" part of the URL
        const authCode = urlParams.get('code');
        const codeBox = document.getElementById('codeBox');

        // 3. Put the code in the text box
        if (authCode) {
            // Google sometimes passes URL-encoded codes (like 4%2F), this decodes it back to 4/
            codeBox.value = decodeURIComponent(authCode); 
        } else {
            codeBox.value = "Error: No code found in the URL. Please try logging in via the bot again.";
        }

        // 4. The Copy Button Logic
        function copyCode() {
            if (!authCode) return;
            
            codeBox.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            btn.innerText = "Copied! ✅";
            btn.style.backgroundColor = "#2E7D32"; // Darker green
            
            // Change back after 2 seconds
            setTimeout(() => {
                btn.innerText = "Copy to clipboard";
                btn.style.backgroundColor = "#4CAF50";
            }, 2000);
        }
    </script>

</body>
</html>
